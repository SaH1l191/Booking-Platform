version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: booking-mysql
    restart: unless-stopped
    environment: 
      MYSQL_DATABASE: booking_platform
      MYSQL_USER: mysqluser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
